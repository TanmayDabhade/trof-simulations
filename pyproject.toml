[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trof-simulations"
version = "0.1.0"
description = "Reproducible simulations for the Thermal Resource Orchestration Framework"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PuLP>=2.8",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["trof/tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["trof*"]
