name: study

# Runs the TROF study on GitHub-hosted runners. Each round splits the pending
# runs across jobs x workers (one CBC process per core), merges the shard
# registries, commits results to the branch, and optionally re-dispatches.

on:
  workflow_dispatch:
    inputs:
      mc_draws:
        description: Monte Carlo parameter draws (paper design is 500)
        default: "50"
      budget_seconds:
        description: Stop starting new runs after this many seconds (a run in progress still finishes)
        default: "9000"
      jobs:
        description: Parallel jobs (max 20 concurrent on free plans)
        default: "20"
      auto_continue:
        description: Re-dispatch automatically until nothing is pending
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: study-${{ github.ref }}
  cancel-in-progress: false

env:
  WORKERS: 4

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - id: plan
        run: |
          pending=$(PYTHONPATH=. python .github/scripts/ci_study.py pending ${{ inputs.mc_draws }})
          jobs=$(( (pending + WORKERS - 1) / WORKERS ))
          jobs=$(( jobs < ${{ inputs.jobs }} ? jobs : ${{ inputs.jobs }} ))
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "jobs=$(python -c "import json; print(json.dumps(list(range($jobs))))")" >> "$GITHUB_OUTPUT"
          echo "Pending runs: $pending, jobs this round: $jobs x $WORKERS workers" >> "$GITHUB_STEP_SUMMARY"

  run:
    needs: plan
    if: needs.plan.outputs.pending != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run shards
        timeout-minutes: 340
        run: |
          nproc
          shard_count=$(( ${{ strategy.job-total }} * WORKERS ))
          pids=()
          for k in $(seq 0 $((WORKERS - 1))); do
            dir=work/w$k
            mkdir -p "$dir"
            cp -r trof study.py results "$dir/"
            index=$(( ${{ matrix.job }} * WORKERS + k ))
            (cd "$dir" && python study.py \
              --mc-draws ${{ inputs.mc_draws }} \
              --budget-seconds ${{ inputs.budget_seconds }} \
              --shard-index $index --shard-count $shard_count --continue-on-error \
              > ../../shard-$index.log 2>&1) &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          tail -n 5 shard-*.log
          grep -h "^FAILED" shard-*.log || true
          exit $status
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.job }}
          path: |
            work/*/results/run_registry.csv
            work/*/results/timeseries/
            work/*/results/failed_runs.csv
            shard-*.log
          if-no-files-found: ignore
          retention-days: 7

  merge:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Merge shards and regenerate tables and figures
        run: |
          export PYTHONPATH=.
          python .github/scripts/ci_study.py merge shards
          python figures.py
          pending=$(python .github/scripts/ci_study.py pending ${{ inputs.mc_draws }})
          echo "PENDING=$pending" >> "$GITHUB_ENV"
          echo "Pending runs after merge: $pending" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/failed_runs.csv ]; then
            echo "Failed runs (not in results): $(( $(wc -l < results/failed_runs.csv) - 1 ))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/
            figures/
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add results figures
          git diff --cached --quiet && exit 0
          git commit -m "Update study results (${PENDING} runs pending) [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
      - name: Continue study
        # Stop if this round made no progress (e.g. a run that always crashes).
        if: env.PENDING != '0' && fromJson(env.PENDING) < fromJson(needs.plan.outputs.pending) && inputs.auto_continue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh workflow run study.yml --ref "${{ github.ref_name }}"
          -f mc_draws=${{ inputs.mc_draws }}
          -f budget_seconds=${{ inputs.budget_seconds }}
          -f jobs=${{ inputs.jobs }}
          -f auto_continue=true
